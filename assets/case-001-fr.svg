<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="Affaire 001, Le nid du corbeau. Statut : non résolue. Difficulté : moyenne.">
<style>
.s{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif} .m{font-family:Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace}
.stamp{transform-box:fill-box;transform-origin:center;transform:rotate(-12deg);opacity:0;animation:stamp .45s cubic-bezier(.2,1.6,.4,1) 1.1s forwards}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(2.4)}100%{opacity:.92;transform:rotate(-12deg) scale(1)}}
.scan{animation:scan 3.2s ease-in-out 1.8s infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translateY(248px);opacity:0}}
@media (prefers-reduced-motion: reduce){.stamp{animation:none;opacity:.92}.scan{animation:none;opacity:0}}
</style>
<defs><clipPath id="ph"><rect x="0" y="0" width="360" height="256" rx="4"/></clipPath>
<pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#18294a"/></pattern></defs>
<rect width="1000" height="400" rx="14" fill="#0d1726"/>
<rect width="1000" height="400" rx="14" fill="url(#g)" opacity=".6"/>
<g transform="translate(56,64) rotate(-3 190 140)">
  <rect x="-12" y="-12" width="384" height="296" rx="6" fill="#e9edf3"/>
  <g clip-path="url(#ph)"><image href="data:image/jpeg;base64," width="360" height="256"/>
  <rect class="scan" x="0" y="0" width="360" height="3" fill="#2e9bff"/></g>
  <text x="180" y="276" text-anchor="middle" class="m" font-size="15" fill="#3a4a63">evidence.jpg</text>
</g>
<circle cx="246" cy="58" r="10" fill="#ff5a5f"/><circle cx="243" cy="55" r="3" fill="#ffd0d1"/>
<text x="500" y="92" class="m" font-size="18" fill="#2e9bff">AFFAIRE #001</text>
<text x="500" y="150" class="s" font-size="40" font-weight="700" fill="#e4ebf4">Le nid du corbeau</text>
<text x="500" y="188" class="s" font-size="18" fill="#8fa1ba">Une photo. Une note effacée. Un nom à trouver.</text>
<line x1="500" y1="206" x2="940" y2="206" stroke="#24385a" stroke-dasharray="5 5"/>
<text x="500" y="246" class="s" font-size="16" fill="#8fa1ba">Difficulté</text><rect x="630" y="236" width="20" height="10" rx="2" fill="#f2c14e"/><rect x="656" y="236" width="20" height="10" rx="2" fill="#f2c14e"/><rect x="682" y="236" width="20" height="10" rx="2" fill="#f2c14e"/><rect x="708" y="236" width="20" height="10" rx="2" fill="#24385a"/><rect x="734" y="236" width="20" height="10" rx="2" fill="#24385a"/>
<text x="770" y="246" class="s" font-size="16" fill="#f2c14e" font-weight="600">Moyenne</text>
<text x="500" y="282" class="s" font-size="16" fill="#8fa1ba">Indices</text>
<text x="630" y="282" class="s" font-size="16" fill="#e4ebf4">Tout est dans ce dépôt</text>
<text x="500" y="318" class="s" font-size="16" fill="#8fa1ba">Récompense</text>
<text x="630" y="318" class="s" font-size="16" fill="#e4ebf4">Ton nom au Hall of fame</text>
<g class="stamp">
  <rect x="790" y="22" width="180" height="54" rx="6" fill="none" stroke="#ff5a5f" stroke-width="4"/>
  <rect x="797" y="29" width="166" height="40" rx="3" fill="none" stroke="#ff5a5f" stroke-width="1.5"/>
  <text x="880" y="60" text-anchor="middle" class="s" font-size="23" font-weight="800" letter-spacing="2" fill="#ff5a5f">NON RÉSOLU</text>
</g>
</svg>
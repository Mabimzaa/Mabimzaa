<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="60" viewBox="0 0 1000 60" role="img" aria-label="$ whoami">
<style>
.m{font-family:Consolas,Menlo,"DejaVu Sans Mono","Courier New",monospace;font-size:22px}
.cover{transform-box:fill-box;transform-origin:right center;animation:type 0.42s steps(6) .3s forwards}
.cur{animation:move 0.42s steps(6) .3s forwards, blink 1s steps(1) infinite}
@keyframes type{to{transform:scaleX(0)}}
@keyframes move{to{transform:translateX(79.2px)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover{display:none}}
</style>
<rect width="1000" height="60" rx="10" fill="#0d1726" stroke="#24385a"/>
<circle cx="28" cy="30" r="7" fill="#ff5a5f"/><circle cx="52" cy="30" r="7" fill="#f2c14e"/><circle cx="76" cy="30" r="7" fill="#3ccf91"/>
<text x="110" y="38" class="m" fill="#2e9bff">mabimzaa@corvus:~$</text>
<text x="360.8" y="38" class="m" fill="#e4ebf4">whoami</text>
<rect class="cover" x="359.8" y="12" width="83.2" height="36" fill="#0d1726"/>
<rect class="cur" x="360.8" y="16" width="12" height="26" fill="#f2c14e"/>
</svg>